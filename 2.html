<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#f4f2e9" />
	<title>What Raghav Says and What He Means</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #263d35;
			--muted: #718078;
			--paper: #faf9f4;
			--peach: #e8c5ca;
			--orange: #587765;
			--gold: #d9aeb6;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 48px 20px;
			display: grid;
			place-items: center;
			color: var(--ink);
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background:
				radial-gradient(ellipse at 12% 12%, rgba(255, 255, 255, .86) 0, transparent 36%),
				radial-gradient(ellipse at 88% 84%, rgba(211, 177, 180, .2) 0, transparent 38%),
				linear-gradient(rgba(250, 249, 244, .72), rgba(232, 238, 230, .72)),
				url("All_Summer_Beauty_Hydrangea_in_a_Landscaping__34970.webp") center / cover fixed,
				linear-gradient(135deg, #f7f5ed, #e8eee6 55%, #f1e9e4);
		}

		.card {
			width: min(100%, 650px);
			padding: clamp(28px, 6vw, 56px);
			border: 1px solid rgba(88, 119, 101, .18);
			border-radius: 28px;
			background: rgba(220, 231, 223, .97);
			box-shadow: 0 24px 70px rgba(44, 65, 53, .13), 0 2px 8px rgba(44, 65, 53, .07);
			backdrop-filter: blur(12px);
		}

		.eyebrow {
			margin: 0 0 14px;
			color: var(--orange);
			font-size: .76rem;
			font-weight: 800;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 540px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2.35rem, 8vw, 4.3rem);
			font-weight: 500;
			letter-spacing: -.055em;
			line-height: .98;
		}

		.intro {
			margin: 20px 0 30px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.6;
		}

		form { display: flex; gap: 10px; }

		input {
			min-width: 0;
			flex: 1;
			padding: 15px 17px;
			border: 1px solid #d7ded4;
			border-radius: 14px;
			outline: none;
			background: #fffefa;
			color: var(--ink);
			font: inherit;
			transition: border-color .2s, box-shadow .2s;
		}

		input::placeholder { color: #89958c; }
		input:focus { border-color: var(--orange); box-shadow: 0 0 0 4px rgba(88, 119, 101, .15); }

		button {
			padding: 0 21px;
			border: 0;
			border-radius: 14px;
			background: #587765;
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			transition: background .2s, transform .2s;
		}

		button:hover { background: #405e4d; transform: translateY(-1px); }
		button:focus-visible, .example:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

		.hint { margin: 12px 0 0; color: var(--muted); font-size: .85rem; }

		.result {
			display: none;
			margin-top: 28px;
			padding: 23px;
			border-left: 4px solid var(--gold);
			border-radius: 4px 16px 16px 4px;
			background: #f5efeb;
			animation: arrive .25s ease-out;
		}

		.result.visible { display: block; }
		.result-label { margin: 0 0 8px; color: var(--orange); font-size: .72rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
		.result h2 { margin: 0 0 7px; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 500; }
		.result p:last-child { margin: 0; color: #52645a; line-height: 1.55; }

		.examples { margin-top: 32px; }
		.examples-title { margin: 0 0 12px; color: var(--muted); font-size: .8rem; font-weight: 700; }
		.chips { display: flex; flex-wrap: wrap; gap: 8px; }
		.example {
			padding: 8px 12px;
			border: 1px solid #d7ded4;
			border-radius: 999px;
			background: #f5f5ef;
			color: #52645a;
			cursor: pointer;
			font: inherit;
			font-size: .82rem;
		}
		.example:hover { background: #eee2e1; }

		@keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 480px) {
			body { padding: 22px 14px; }
			form { flex-direction: column; }
			form button { min-height: 50px; }
			.card { border-radius: 22px; }
		}re
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<main class="card">
		<p class="eyebrow">A very unofficial phrasebook</p>
		<h1>What Raghav Says and What He Means</h1>
		<p class="intro">Put in a classic Raghav-ism. We’ll translate the words into the meaning.</p>

		<form id="search-form" role="search">
			<input id="phrase" type="search" placeholder='Try “I’m on my way”' aria-label="Search a phrase Raghav says" autocomplete="off" />
			<button type="submit">Translate</button>
		</form>
		<p class="hint">Try a phrase below, or type your own.</p>

		<section id="result" class="result" aria-live="polite" aria-atomic="true">
			<p class="result-label">Translation</p>
			<h2 id="said"></h2>
			<p id="means"></p>
		</section>

		<section class="examples" aria-label="Example phrases">
			<p class="examples-title">The Phrases Being.</p>
			<div class="chips" id="examples"></div>
		</section>
	</main>

	<script>
		// Add or edit phrases here; searches are matched without regard to capitalization.
		const translations = [
			{ phrase: "Perhaps", meaning: "Not at all." },
			{ phrase: "I'm on my way", meaning: "I have just started getting ready." },
			{ phrase: "Two minutes", meaning: "Time is a flexible concept, but I appreciate your patience." },
			{ phrase: "I'll think about it", meaning: "Probably no," },
			{ phrase: "It is what it is", meaning: "Will not be opening another discussion about it." },
			{ phrase: "I know a shortcut", meaning: "We may arrive sooner, later, or somewhere interesting." },
			{ phrase: "I'm fine", meaning: "I am not yet ready to admit it but Id appreciate your patience and want you to stick around, yet I won't say it." },
			{ phrase: "Let's see", meaning: "I won't see." },
			{ phrase: "I'm not hungry", meaning: "I will still want a bite of whatever you order." },
			{ phrase: "One last thing", meaning: "There are at least three more things." },
			{ phrase: "Bye", meaning: "Abhe Na Jao Chod Kar, Ke Dil Abhe Bhara Nahi" },
			{ phrase: "Trust me", meaning: "This plan is powered by confidence, not necessarily evidence." },
			{ phrase: "I'll call you back", meaning: "I saw your call and hope this buys me a little time." },
			{ phrase: "Jaan Mere", meaning: "Yup You." },
			{ phrase: "mere jaan", meaning: "You, Yes You." },
			{ phrase: "Sohneo", meaning: "Yup You." },
			{ phrase: "baby", meaning: "You, Yes You." },
			{ phrase: "ashma manhas", meaning: "You, Yes You." },
			{ phrase: "sunshine", meaning: "You, Yes You." },
			{ phrase: "violence", meaning: "You, Yes You." }
		];

		const form = document.querySelector("#search-form");
		const input = document.querySelector("#phrase");
		const result = document.querySelector("#result");
		const said = document.querySelector("#said");
		const means = document.querySelector("#means");

		function showTranslation(query) {
			const normalized = query.trim().toLowerCase();
			if (!normalized) {
				input.focus();
				return;
			}

			const clean = value => value.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
			const search = clean(normalized);
			const distance = (left, right) => {
				const row = Array.from({ length: right.length + 1 }, (_, index) => index);
				for (let i = 1; i <= left.length; i++) {
					let diagonal = row[0];
					row[0] = i;
					for (let j = 1; j <= right.length; j++) {
						const above = row[j];
						row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (left[i - 1] === right[j - 1] ? 0 : 1));
						diagonal = above;
					}
				}
				return row[right.length];
			};
			let match = translations.find(item => clean(item.phrase) === search)
				|| translations.find(item => clean(item.phrase).includes(search) || search.includes(clean(item.phrase)));

			if (!match && search.length >= 4) {
				let bestDistance = Infinity;
				for (const item of translations) {
					const phrase = clean(item.phrase);
					for (let start = 0; start < phrase.length; start++) {
						for (let length = Math.max(1, search.length - 2); length <= search.length + 2 && start + length <= phrase.length; length++) {
							const candidateDistance = distance(search, phrase.slice(start, start + length).trim());
							if (candidateDistance < bestDistance) {
								bestDistance = candidateDistance;
								match = item;
							}
						}
					}
				}
				if (bestDistance > Math.max(1, Math.floor(search.length * 0.25))) match = undefined;
			}

			const fallbackMeaning = phrase => {
				const text = phrase.toLowerCase();
				if (/\b(can you|could you|please|would you)\b/.test(text)) return "A request has entered the chat. Noted—and we’ll handle it on a sensible timeline, not by panic.";
				if (/\b(sorry|apolog|my fault)\b/.test(text)) return "Apology received. We can move on now; no courtroom drama required.";
				if (/\b(maybe|perhaps|might|not sure|we'll see)\b/.test(text)) return "That is a maybe wearing a very convincing disguise. No decision yet, and that is the decision for now.";
				if (/\b(love|miss you|thank you|thanks)\b/.test(text)) return "A nice thing was said. Accepted graciously; please allow one full second for me to enjoy it.";
				if (/\b(when|where|why|what|how|who)\b/.test(text)) return "That appears to be a question. I heard you; I’ll answer when I have something useful, not just noise.";
				if (/\b(will|going to|plan|tomorrow|later)\b/.test(text)) return "A plan has been announced. Treat it as a plan, not a legally binding launch schedule.";
				return "Meaning: you said your piece; I heard you. We’ll take it one step at a time, without turning it into a committee meeting.";
			};

			said.textContent = match ? `“${match.phrase}”` : `“${query.trim()}”`;
			means.textContent = match
				? match.meaning
				: fallbackMeaning(query.trim());
			result.classList.add("visible");
		}

		form.addEventListener("submit", event => {
			event.preventDefault();
			showTranslation(input.value);
		});

		const examples = document.querySelector("#examples");
		const hiddenExamples = new Set(["mere jaan", "baby", "ashma manhas", "violence"]);
		const mixedTranslations = translations.filter(item => !hiddenExamples.has(item.phrase.toLowerCase()));
		for (let i = mixedTranslations.length - 1; i > 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[mixedTranslations[i], mixedTranslations[j]] = [mixedTranslations[j], mixedTranslations[i]];
		}
		mixedTranslations.forEach(item => {
			const chip = document.createElement("button");
			chip.type = "button";
			chip.className = "example";
			chip.textContent = item.phrase;
			chip.addEventListener("click", () => {
				input.value = item.phrase;
			});
			examples.append(chip);
		});
	</script>
</body>
</html>
