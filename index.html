	<title>What Ashma Says and What She Means</title>

		.card {
			position: relative;
			z-index: 1;
			width: min(100%, 650px);
			padding: clamp(28px, 6vw, 56px);
			border: 1px solid var(--line);
			border-radius: 28px;
			background: var(--panel);
			box-shadow: 0 24px 70px rgba(20, 8, 15, .42), 0 2px 8px rgba(20, 8, 15, .18);
			backdrop-filter: blur(14px);
		}

		.eyebrow {
			margin: 0 0 14px;
			color: var(--rose);
			font-size: .76rem;
			font-weight: 800;
			letter-spacing: .16em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 540px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2.35rem, 8vw, 4.3rem);
			font-weight: 500;
			letter-spacing: -.055em;
			line-height: .98;
		}

		.intro {
			margin: 20px 0 30px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.6;
		}

		form { display: flex; gap: 10px; }

		input {
			min-width: 0;
			flex: 1;
			padding: 15px 17px;
			border: 1px solid rgba(255, 205, 220, .24);
			border-radius: 14px;
			outline: none;
			background: rgba(37, 20, 29, .72);
			color: var(--ink);
			font: inherit;
			transition: border-color .2s, box-shadow .2s, background .2s;
		}

		input::placeholder { color: #d3aeba; }
		input:focus { border-color: var(--sage); box-shadow: 0 0 0 4px rgba(237, 151, 181, .2); background: rgba(48, 25, 36, .88); }

		button {
			padding: 0 21px;
			border: 0;
			border-radius: 14px;
			background: linear-gradient(180deg, var(--sage), var(--sage-deep));
			color: #fff7f8;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			transition: filter .2s, transform .2s;
		}

		button:hover { filter: brightness(1.08); transform: translateY(-1px); }
		button:focus-visible, .example:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

		.hint { margin: 12px 0 0; color: var(--muted); font-size: .85rem; }

		.result {
			display: none;
			margin-top: 28px;
			padding: 23px;
			border-left: 4px solid var(--gold);
			border-radius: 4px 16px 16px 4px;
			background: var(--result-bg);
			box-shadow: inset 0 0 0 1px rgba(204, 186, 169, .06);
			animation: arrive .25s ease-out;
		}

		.result.visible { display: block; }
		.result-label { margin: 0 0 8px; color: var(--rose); font-size: .72rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
		.result h2 { margin: 0 0 7px; font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; font-weight: 500; color: var(--ink); }
		.result p:last-child { margin: 0; color: var(--result-text); line-height: 1.55; }

		.examples { margin-top: 32px; }
		.examples-title { margin: 0 0 12px; color: var(--muted); font-size: .8rem; font-weight: 700; }
		.chips { display: flex; flex-wrap: wrap; gap: 8px; }
		.example {
			padding: 8px 12px;
			border: 1px solid rgba(196, 180, 170, .2);
			border-radius: 999px;
			background: rgba(190, 105, 137, .2);
			color: var(--ink);
			cursor: pointer;
			font: inherit;
			font-size: .82rem;
			transition: background .2s, border-color .2s;
		}
		.example:hover { background: rgba(213, 125, 157, .34); border-color: rgba(255, 205, 220, .4); }
		.extra-link {
			position: fixed;
			z-index: 2;
			bottom: max(18px, env(safe-area-inset-bottom));
			left: 50%;
			padding: 13px 22px;
			border: 1px solid rgba(255, 211, 168, .5);
			border-radius: 999px;
			background: linear-gradient(135deg, rgba(215, 127, 156, .98), rgba(169, 83, 118, .98));
			box-shadow: 0 8px 28px rgba(20, 8, 15, .38), 0 0 22px rgba(237, 151, 181, .24);
			color: var(--ink);
			font-size: .92rem;
			font-weight: 700;
			text-align: center;
			text-decoration: none;
			transform: translateX(-50%);
			animation: extra-float 3s ease-in-out infinite;
			transition: filter .2s, box-shadow .2s;
		}
		.extra-link:hover { filter: brightness(1.1); box-shadow: 0 10px 32px rgba(20, 8, 15, .46), 0 0 28px rgba(237, 151, 181, .35); }
		.extra-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

		@keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes extra-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
		@keyframes petals-fall { from { transform: translateY(-12vh) rotate(0deg); } to { transform: translateY(125vh) rotate(30deg); } }
		@media (max-width: 480px) {
			body { padding: 22px 14px; }
			form { flex-direction: column; }
			form button { min-height: 50px; }
			.card { border-radius: 22px; }
			body::before { background-size: 38vw 52vh; opacity: .38; }
		}
		@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
	</style>
</head>
<body>
	<main class="card">
		<p class="eyebrow">A very unofficial phrasebook</p>
		<h1>What Ashma Says and What She Means</h1>
		<p class="intro">Put in a classic Ashma-ism. We’ll translate the words into the meaning.</p>

		<form id="search-form" role="search">
			<input id="phrase" type="search" placeholder='Try “I’m on my way”' aria-label="Search a phrase Ashma says" autocomplete="off" />
			<button type="submit">Translate</button>
		</form>
		<p class="hint">Try a phrase below, or type your own.</p>

		<section id="result" class="result" aria-live="polite" aria-atomic="true">
			<p class="result-label">Translation</p>
			<h2 id="said"></h2>
			<p id="means"></p>
		</section>

		<section class="examples" aria-label="Example phrases">
			<p class="examples-title">The Phrases Being.</p>
			<div class="chips" id="examples"></div>
		</section>
	</main>
	<a class="extra-link" href="2.html">Might Help</a>

	<script>
		// Add or edit phrases here; searches are matched without regard to capitalization.
		const translations = [
			{ phrase: "I'm not hungry", meaning: "Had no energy to cook." },
			{ phrase: "I'll call you back", meaning: "Not like someone was waiting or anything..." },
			{ phrase: "Sarea pea hai", meaning: "wow im just too astonished to say anything to that" },
			{ phrase: "Let's see", meaning: "Dont feel like deciding." },
			{ phrase: "Maybe", meaning: "Actually, very literally maybe." },
			{ phrase: "Two minutes", meaning: "Time is a flexible concept, but I appreciate your patience." },
			{ phrase: "I'll think about it", meaning: "Probably no," },
			{ phrase: "It is what it is", meaning: "Will not be opening another discussion about it." },
			{ phrase: "I'm fine", meaning: "I am not yet ready to admit it but Id appreciate your patience and want you to stick around, yet I won't say it." }
		];

		const form = document.querySelector("#search-form");
		const input = document.querySelector("#phrase");
		const result = document.querySelector("#result");
		const said = document.querySelector("#said");
		const means = document.querySelector("#means");
		const fallbackReplies = [
			"Bold move. I’m choosing not to overthink it.",
			"Noted. I’ll file that under things I’ll bring up later.",
			"I hear you, and I’m glad you said it.",
			"Okay. You still have a little corner of my heart.",
			"Understood. The day continues, somehow.",
			"Quietly noted. Just a long pause and a sip of tea."
		];

		function showTranslation(query) {
			const normalized = query.trim().toLowerCase();
			if (!normalized) {
				input.focus();
				return;
			}

			const clean = value => value.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
			const search = clean(normalized);
			const distance = (left, right) => {
				const row = Array.from({ length: right.length + 1 }, (_, index) => index);
				for (let i = 1; i <= left.length; i++) {
					let diagonal = row[0];
					row[0] = i;
					for (let j = 1; j <= right.length; j++) {
						const above = row[j];
						row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (left[i - 1] === right[j - 1] ? 0 : 1));
						diagonal = above;
					}
				}
				return row[right.length];
			};
			let match = translations.find(item => clean(item.phrase) === search)
				|| translations.find(item => clean(item.phrase).includes(search) || search.includes(clean(item.phrase)));

			if (!match && search.length >= 4) {
				let bestDistance = Infinity;
				for (const item of translations) {
					const phrase = clean(item.phrase);
					for (let start = 0; start < phrase.length; start++) {
						for (let length = Math.max(1, search.length - 2); length <= search.length + 2 && start + length <= phrase.length; length++) {
							const candidateDistance = distance(search, phrase.slice(start, start + length).trim());
							if (candidateDistance < bestDistance) {
								bestDistance = candidateDistance;
								match = item;
							}
						}
					}
				}
				if (bestDistance > Math.max(1, Math.floor(search.length * 0.25))) match = undefined;
			}

			said.textContent = match ? `“${match.phrase}”` : `“${query.trim()}”`;
			means.textContent = match
				? match.meaning
				: fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
			result.classList.add("visible");
		}

		form.addEventListener("submit", event => {
			event.preventDefault();
			showTranslation(input.value);
		});

		const examples = document.querySelector("#examples");
		translations.forEach(item => {
			const chip = document.createElement("button");
			chip.type = "button";
			chip.className = "example";
			chip.textContent = item.phrase;
			chip.addEventListener("click", () => {
				input.value = item.phrase;
			});
			examples.append(chip);
		});
	</script>
